<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Eto QrCode: make a styled QR code for any link, text, Wi-Fi, WhatsApp, contact or file link. Download PNG, SVG, JPG or WebP.">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101B2E">
<meta property="og:type" content="website">
<meta property="og:title" content="Eto QrCode">
<meta property="og:description" content="اعمل كود QR بشكلك أو امسح أي كود بالكاميرا أو من صورة. مجاني وعلى جهازك.">
<meta property="og:image" content="https://github.com/EngMohammedSaad/Qr-Code/blob/main/icon.png?raw=true">
<meta property="og:url" content="https://engmohammedsaad.github.io/Qr-Code/">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://github.com/EngMohammedSaad/Qr-Code/blob/main/icon.png?raw=true">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Eto QrCode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E8ECF2; --surface:#FFFFFF; --surface2:#F1F4F8; --ink:#101B2E; --ink2:#566480; --line:#D1D8E3;
  --accent:#D6195E; --accent-ink:#FFFFFF; --good:#14794A; --warn:#8F5000; --bad:#B3261E; --focus:#1F5FD6;
  --sheet:#FFFFFF; --check1:#DDE2EA; --check2:#F4F6FA; --shadow:0 1px 0 rgba(16,27,46,.04),0 12px 32px -18px rgba(16,27,46,.35);
  --display:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111D; --surface:#141D30; --surface2:#1B2740; --ink:#E8EDF6; --ink2:#9BA9C2; --line:#28364F;
    --accent:#FF5C93; --accent-ink:#2A0613; --good:#4FD28D; --warn:#F2B35E; --bad:#FF8F85; --focus:#7FA8FF;
    --sheet:#EEF1F6; --check1:#C9CFDA; --check2:#E3E7EE; --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111D; --surface:#141D30; --surface2:#1B2740; --ink:#E8EDF6; --ink2:#9BA9C2; --line:#28364F;
  --accent:#FF5C93; --accent-ink:#2A0613; --good:#4FD28D; --warn:#F2B35E; --bad:#FF8F85; --focus:#7FA8FF;
  --sheet:#EEF1F6; --check1:#C9CFDA; --check2:#E3E7EE; --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);padding-inline:16px;padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{max-width:1120px;margin-inline:auto;padding-block:20px 40px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block-end:20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;text-decoration:none}
.brand svg{width:40px;height:40px;flex:none;color:var(--ink)}
.brand h1{margin:0;font:800 26px/1 var(--display);letter-spacing:-.02em;direction:ltr}
.brand h1 b{color:var(--accent);font-weight:800}
.tag{margin:0;color:var(--ink2);font-size:14px;flex:1 1 220px;min-width:0}
.tools{display:flex;gap:8px;margin-inline-start:auto}
.tbtn{height:36px;min-width:36px;padding-inline:12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tbtn:hover{border-color:var(--ink2)}
.tbtn svg{width:16px;height:16px}
.grp{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0;padding-block-start:0}
.grp>h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
html[lang="ar"] .grp>h3{letter-spacing:0;font-size:13px;text-transform:none}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.chip,.opt,.seg button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;cursor:pointer;color:var(--ink);transition:background .12s,border-color .12s}
.chip{padding:9px 10px;font-weight:600;font-size:14px;text-align:center}
.chip:hover,.opt:hover,.seg button:hover{border-color:var(--ink2)}
.chip[aria-pressed="true"],.opt[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{margin:0;color:var(--ink2);font-size:13px}
.hint.ex{color:var(--warn)}
.hint.tip{font-size:12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:13px;font-weight:600}
input[type=text],input[type=password],input[type=tel],input[type=email],input[type=url],input[type=number],select,textarea{width:100%;min-width:0;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px}
textarea{min-height:104px;resize:vertical}
input.ltr,textarea.ltr{direction:ltr;text-align:start}
html[dir="rtl"] input.ltr,html[dir="rtl"] textarea.ltr{text-align:left}
input:focus,select:focus,textarea:focus{border-color:var(--focus)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.preset{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600}
.preset:hover{border-color:var(--ink2)}
.preset .th{width:100%;max-width:64px;aspect-ratio:1;border-radius:4px;overflow:hidden;background:#fff}
.preset .th svg{display:block;width:100%;height:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;font-size:12px;font-weight:600}
.opt .ico{width:34px;height:34px;display:block}
.opt .ico svg{width:100%;height:100%;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;font-size:13px;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.crow{display:flex;align-items:center;gap:10px;min-width:0}
.crow>span{flex:1 1 auto;font-size:14px;min-width:0}
.crow input[type=color]{width:42px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer;flex:none}
.crow input.hex{width:96px;flex:none;direction:ltr;text-align:left;font-family:var(--mono);font-size:13px;padding:7px 8px}
.rng{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:14px}
.rng output{font:500 13px var(--mono);color:var(--ink2);direction:ltr}
.rng input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.sub{display:flex;flex-direction:column;gap:10px;padding-inline-start:12px;border-inline-start:2px solid var(--line)}
.logorow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logoth{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface2) center/contain no-repeat}
.btn{height:38px;padding-inline:14px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.stage{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.sheet{position:relative;background:var(--sheet);border-radius:6px;padding:26px;display:grid;place-items:center;aspect-ratio:1/1.0;overflow:hidden}
.sheet .cm{position:absolute;width:12px;height:12px;border:0 solid var(--ink2);opacity:.7}
.sheet .cm.tl{top:8px;inset-inline-start:8px;border-top-width:1.5px;border-inline-start-width:1.5px}
.sheet .cm.tr{top:8px;inset-inline-end:8px;border-top-width:1.5px;border-inline-end-width:1.5px}
.sheet .cm.bl{bottom:8px;inset-inline-start:8px;border-bottom-width:1.5px;border-inline-start-width:1.5px}
.sheet .cm.br{bottom:8px;inset-inline-end:8px;border-bottom-width:1.5px;border-inline-end-width:1.5px}
.qrbox{width:100%;line-height:0;display:grid;place-items:center}
.qrbox svg{display:block;width:100%;height:auto;max-height:100%}
.sheet.transp .qrbox{background:repeating-conic-gradient(var(--check1) 0 25%,var(--check2) 0 50%) 0 0/16px 16px}
.empty{padding:20px;text-align:center;color:#41506a;font-size:14px;line-height:1.6;max-width:260px}
.empty.bad{color:#9C1C14}
.meta{font:500 12px/1.5 var(--mono);color:var(--ink2);direction:ltr;text-align:center;min-height:18px}
.status{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;padding:8px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.status i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--good)}
.status.warn i{background:var(--warn)}.status.bad i{background:var(--bad)}
.exp{display:flex;flex-direction:column;gap:10px}
.exp h3{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.dl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dl .btn{padding-inline:0;height:42px;font-family:var(--mono);font-size:13px}
.exp .seg{flex-wrap:nowrap;gap:6px}
.exp .seg button{flex:1;padding:7px 4px;font-family:var(--mono);font-size:12px}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:fit-content;max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;z-index:30;box-shadow:var(--shadow)}
@media (max-width:880px){
  .bench{grid-template-columns:minmax(0,1fr)}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;order:-1;display:grid;grid-template-columns:136px minmax(0,1fr);gap:6px 12px;padding:10px;align-items:start;border-radius:10px}
  .sheet{padding:8px;grid-row:1/4;aspect-ratio:1/1;align-self:start}
  .sheet .cm{display:none}
  .meta{text-align:start;grid-column:2;font-size:11px;min-height:0}
  .status{grid-column:2;padding:5px 8px;font-size:12px}
  .exp{grid-column:2;gap:6px}
  .hint.tip{display:none}
  .exp h3{display:none}
  .dl .btn{height:36px}
  .empty{padding:6px;font-size:12px}
}
@media (max-width:520px){
  .fields{grid-template-columns:1fr}
  .brand h1{font-size:22px}
}
.bench{display:grid;grid-template-columns:184px minmax(0,1fr) minmax(300px,380px);gap:20px;align-items:start;direction:ltr}
#app[dir="rtl"] .bench>*{direction:rtl}
#app[dir="ltr"] .bench>*{direction:ltr}
.rail{display:flex;flex-direction:column;gap:8px;position:sticky;top:16px}
.rtab{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;text-align:start;color:var(--ink);min-width:0;transition:background .12s,border-color .12s}
.rtab:hover{border-color:var(--ink2)}
.rtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rtab .ri{flex:none;width:22px;height:22px;display:block}
.rtab .ri svg{width:100%;height:100%;display:block}
.rtab .rt{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}
.rtab b{font-size:14px;font-weight:700;line-height:1.3}
.rtab .rs{font-size:12px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;min-height:18px;line-height:18px}
.rtab .sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid rgba(128,128,128,.6);vertical-align:middle;margin-inline-end:4px}
.rtab.help{margin-top:10px;border-style:dashed}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);min-width:0;min-height:560px}
.phead{display:flex;flex-direction:column;gap:4px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font:800 22px/1.25 var(--display)}
.phead p{margin:0;color:var(--ink2);font-size:14px}
.flag{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700}
.flag svg{width:14px;height:14px}
.tabpane[hidden]{display:none}
.help{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.help .back{align-self:flex-start}
.hhead{display:flex;flex-direction:column;gap:6px}
.help h1{margin:0;font:800 30px/1.2 var(--display)}
.help h2{margin:0;font:700 18px/1.3 var(--display)}
.help .lead{margin:0;color:var(--ink2)}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.hcard.contact{border-color:var(--accent)}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{font:600 24px/1 var(--mono);direction:ltr;letter-spacing:.02em;user-select:all}
.acts{display:flex;gap:8px;flex-wrap:wrap}
a.btn{text-decoration:none}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;counter-reset:s}
.steps li{counter-increment:s;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.steps li::before{content:counter(s);flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--bg);font:600 12px var(--mono)}
details.q{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.q+details.q{margin-top:8px}
details.q summary{cursor:pointer;padding:12px 14px;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}
details.q summary::-webkit-details-marker{display:none}
details.q summary::after{content:"+";font:500 20px/1 var(--mono);color:var(--ink2);flex:none}
details.q[open] summary::after{content:"−"}
details.q .a{padding:0 14px 14px;color:var(--ink2);font-size:14px;line-height:1.7}
details.q .a p{margin:0 0 6px}
.foot{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink2);font-size:13px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.foot p{margin:0}
.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.dev{font-family:var(--display);font-weight:800;letter-spacing:.04em;color:var(--ink);direction:ltr}
@media (max-width:1040px){.bench{grid-template-columns:150px minmax(0,1fr) 320px;gap:14px}.rtab{padding:9px 10px}.rtab .ri{width:20px;height:20px}}
@media (max-width:880px){
  .bench{direction:ltr;grid-template-columns:minmax(0,1fr)}
  .rail{flex-direction:row;overflow-x:auto;position:static;gap:6px;padding-bottom:2px;order:0}
  .rtab{width:auto;flex:none;padding:8px 12px}
  .rtab .rs{display:none}
  .rtab.help{margin-top:0}
  .pane{min-height:0;padding:16px;order:1}
  .phead h2{font-size:19px}
}
#app[data-view="home"] .tag{display:none}
#app[data-view="view"][data-from="link"] .top{display:none}
.home{max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
.hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:20px 0}
.hero .mark{width:76px;height:76px;color:var(--ink)}
.hero h2{margin:0;font:800 clamp(30px,6vw,52px)/1.2 var(--display);letter-spacing:-.01em}
.hero h2 b{color:var(--accent)}
.hero p{margin:0;max-width:580px;color:var(--ink2);font-size:16px;line-height:1.75}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.choice{display:flex;flex-direction:column;gap:12px;text-align:start;padding:26px;border:1px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);text-decoration:none;transition:transform .15s,border-color .15s}
.choice:hover{transform:translateY(-3px);border-color:var(--accent)}
.choice .cico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.choice.alt .cico{background:var(--accent);color:var(--accent-ink)}
.choice .cico svg{width:30px;height:30px}
.choice h3{margin:4px 0 0;font:800 24px/1.25 var(--display)}
.choice p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.75}
.choice .go{margin-top:auto;padding-top:6px;font-weight:700;font-size:14px;color:var(--accent)}
.choice .go::after{content:" \2190"}
#app[dir="ltr"] .choice .go::after{content:" \2192"}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.perk{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.6}
.perk svg{flex:none;width:20px;height:20px;color:var(--accent);margin-top:2px}
.scanwrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h2{margin:0;font:800 26px/1.25 var(--display)}
.pagehead p{margin:0;color:var(--ink2)}
.scancard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.modeseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modeseg button{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
.modeseg button:hover{border-color:var(--ink2)}
.modeseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modeseg svg{width:20px;height:20px}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#0B111D;aspect-ratio:4/3;display:grid;place-items:center;color:#CFD8EA}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;inset:17%;pointer-events:none}
.reticle i{position:absolute;width:30px;height:30px;border:0 solid #fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.7))}
.reticle .a{top:0;left:0;border-top-width:4px;border-left-width:4px;border-top-left-radius:10px}
.reticle .b{top:0;right:0;border-top-width:4px;border-right-width:4px;border-top-right-radius:10px}
.reticle .c{bottom:0;left:0;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:10px}
.reticle .d{bottom:0;right:0;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:10px}
.laser{position:absolute;left:4%;right:4%;top:6%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:laser 2.2s ease-in-out infinite alternate}
@keyframes laser{to{top:94%}}

  ['ممكن أغيّر اللينك بعد الطباعة؟','لأ. الكود ثابت، يعني المحتوى مكتوب جواه ومبينتهيش. لو محتاج تغيّر الوجهة بعدين، خلّي الكود يشاور على صفحة إنت بتتحكم فيها وغيّر وجهتها من هناك.'],
  ['بياناتي بتتبعت لأي مكان؟','لأ. الكود بيتعمل جوّه متصفحك والصور بتتحفظ على جهازك، ومفيش حاجة بتروح لأي سيرفر.'],
  ['إزاي أكتب رقم واتساب صح؟','اكتب الرقم بكود الدولة من غير صفر ولا علامة +. مثال: الرقم المصري 01096925903 يتكتب 201096925903.'],
  ['الشعار بوّظ الكود؟','خلّي حجم الشعار من 15% لـ 25%، واختار تصحيح أخطاء H، وجرّب الكود بموبايلك. لو الخلفية بتاعة الشعار معقدة، سيب خيار مساحة بلون الخلفية شغّال.']
 ],
 en:[
  ['How do I make a code for a file (PDF, image, video)?','A QR code holds a link, not the file. Upload the file to Google Drive, Dropbox or any host, set sharing to "anyone with the link", then paste the link in the Content tab under File. If the file lives on your own website, use its direct URL.'],
  ['My code does not scan. What should I do?','Try these in order: dark code on a light background. A quiet zone of at least 4 modules. Square or rounded eyes instead of circle or leaf. With a logo, keep it under 25% and use error correction Q or H. Print the code larger. And test it with your phone before printing.'],
  ['PNG or SVG?','PNG suits social media and documents. SVG suits large prints and design work because it scales without losing quality. JPG is smaller but has no transparency. WebP suits websites.'],
  ['How big should I print it?','A rough rule: the code width should be about one tenth of the scanning distance. A desk code can be 2 cm, a poster scanned from 3 meters needs about 30 cm.'],
  ['Can I change the link after printing?','No. The code is static: the content is written into it and it never expires. If you may need to change the destination later, point the code to a page you control and change that page.'],
  ['Is my data sent anywhere?','No. Codes are generated inside your browser and images are saved on your device. Nothing goes to a server.'],
  ['How do I write a WhatsApp number?','Use the country code with no leading zero and no + sign. Example: the Egyptian number 01096925903 becomes 201096925903.'],
  ['Did my logo break the code?','Keep the logo between 15% and 25%, choose error correction H, and test with your phone. If the logo has a busy background, leave the background pad option on.']
 ]};
var STEPS={ar:['اختار نوع المحتوى واكتب بياناته.','غيّر الشكل والألوان من الأزرار الجانبية.','اختار المقاس والصيغة ونزّل الكود.'],en:['Choose the content type and fill in the details.','Change the shapes and colors from the side buttons.','Pick a size and format, then download.']};
FAQ.ar.push(['إزاي أمسح كود؟','من الصفحة الرئيسية اختار "امسح كود QR". شغّل الكاميرا ووجّهها على الكود، أو ارفع صورة فيها كود (لقطة شاشة أو صورة من المعرض) أو الصقها بـ Ctrl+V. الكود بيتقري على جهازك وبنعرضلك اللي جواه مرتب.'],['الكاميرا مش بتفتح؟','لازم تدّي المتصفح إذن الكاميرا. لو رفضته قبل كده، افتح إعدادات الموقع في المتصفح وفعّله. وعلى الكمبيوتر اتأكد إن مفيش برنامج تاني فاتح الكاميرا. ولو مفيش كاميرا، استخدم "صورة".'],['إزاي النص يظهر في صفحة حلوة؟','في تاب المحتوى اختار "نص" وسيب خيار "اعرض النص في صفحة" شغال. أي حد يمسح الكود بكاميرا موبايله هيشوف النص في نص صفحة مرتبة من غير ما ينزّل أي برنامج.'],['إزاي أنزّل الموقع كتطبيق؟','من الصفحة الرئيسية اضغط "نزّل التطبيق" وهتشوف شريط التحميل جوه الموقع. على الآيفون: اضغط زر المشاركة واختار "إضافة إلى الشاشة الرئيسية". بعدها بيفتح زي أي برنامج وبيشتغل حتى من غير نت.'],['الأكواد اللي عملتها بتتحفظ؟','تصميمك وآخر محتوى كتبته بيتحفظوا على جهازك لوحدهم، وكمان آخر الأكواد اللي مسحتها. تقدر تمسح السجل في أي وقت من صفحة المسح.']);
FAQ.en.push(['How do I scan a code?','From the home page choose "Scan a QR code". Start the camera and point it at the code, or upload a picture (a screenshot or gallery photo), or paste it with Ctrl+V. It is read on your device and shown neatly.'],['The camera does not open?','Allow camera access for this site. If you denied it before, turn it on in the browser site settings, and close any other app using the camera. With no camera, use "Image".'],['How does text show on a clean page?','In the Content tab choose "Text" and keep "Show the text on a clean page" on. Anyone who scans the code with a phone camera sees the text centered on a tidy page, with no app needed.'],['How do I install it as an app?','On the home page tap "Install the app" and watch the progress bar. On iPhone tap Share and choose "Add to Home Screen". It then opens like any app and works offline.'],['Is my work saved?','Your design and last content are saved on your device automatically, along with recent scans. You can clear the history any time from the scan page.']);
function copyText(txt,okMsg){var p;try{p=navigator.clipboard.writeText(txt)}catch(e){p=Promise.reject(e)}p.then(function(){toast(okMsg)},function(){toast(t('copyFail'))})}
function buildHelp(){
  $('#helpBack').textContent=t('helpBack');
  var b=$('#helpBody');b.replaceChildren();
  b.append(
    h('div',{class:'hhead'},h('h1',{},t('hTitle')),h('p',{class:'lead'},t('hLead'))),
    h('div',{class:'hcard contact'},
      h('h2',{},t('hWaTitle')),h('p',{class:'lead'},t('hWaText')),
      h('div',{class:'numrow'},h('span',{class:'num',dir:'ltr'},WA_LOCAL)),
      h('div',{class:'acts'},
        h('a',{class:'btn pri',href:'https://wa.me/'+WA+'?text='+encodeURIComponent(t('hWaMsg')),target:'_blank',rel:'noopener'},t('hWaOpen')),
        h('button',{type:'button',class:'btn',onclick:function(){copyText(WA_LOCAL,t('hCopied'))}},t('hWaCopy')))),
    h('h2',{},t('hStepsTitle')),
    h('ol',{class:'steps'},STEPS[lang].map(function(x){return h('li',{},x)})),
    h('h2',{},t('hFaqTitle')),
    h('div',{},FAQ[lang].map(function(q,i){return h('details',{class:'q',open:i===0},h('summary',{},q[0]),h('div',{class:'a'},h('p',{},q[1])))})));
}

/* ---------- shell ---------- */
function applyLang(){
  document.documentElement.lang=lang;$('#app').dir=lang==='ar'?'rtl':'ltr';
  $('#tagline').textContent=t('tagline');$('#privacy').textContent=t('foot');$('#copyTxt').replaceChildren(h('bdi',{},'© '+new Date().getFullYear()+' Eto QrCode'),' — '+t('copy'));$('#helpBtnTxt').textContent=t('help');$('#tip').textContent=t('tip');
  $('#langBtn').textContent=lang==='ar'?'English':'العربية';
  if(!design.captionText||design.captionText===S.captionDefault.ar||design.captionText===S.captionDefault.en)design.captionText=t('captionDefault');
  i18nStatic();buildTypes();buildForm();buildDesign();buildExport();buildRail();buildHelp();showView(state.view,{fromLink:state.fromLink});refreshDyn();renderHist();update();
  try{localStorage.setItem('eto-lang',lang)}catch(e){}}
function init(){
  try{var l=localStorage.getItem('eto-lang');if(l==='en'||l==='ar')lang=l}catch(e){}
  try{var th=localStorage.getItem('eto-theme');if(th==='dark'||th==='light')document.documentElement.setAttribute('data-theme',th)}catch(e){}
  $('#langBtn').addEventListener('click',function(){lang=lang==='ar'?'en':'ar';applyLang()});
  $('#themeBtn').addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var nx=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',nx);
    try{localStorage.setItem('eto-theme',nx)}catch(e){}});
  $('#copySvg').addEventListener('click',copySvg);
  $('#helpBtn').addEventListener('click',function(){go('help')});
  $('#helpBack').addEventListener('click',function(){go('home')});
  $('#brandLink').addEventListener('click',function(e){e.preventDefault();go('home')});
  loadState();
  initScan();
  initInstall();
  applyLang();
  route();
  window.addEventListener('hashchange',route);
  window.__eto={FRAME:FRAME,BALL:BALL,design:design,state:state,values:values,update:update,buildSVG:buildSVG,exportAs:exportAs};
}
init();
})();
